<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>محاكي الامتحان النهائي - أمن المعلومات</title>
    <style>
        :root {
            --navy: #174d38;
            --blue: #1769aa;
            --gold: #f1b544;
            --light: #f5f8fb;
            --green: #16805b;
            --red: #bf3f42;
            --ink: #1f2933;
            --muted: #687789;
            --bg: #eef3f7;
            --border-radius: 12px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: Tahoma, Arial, sans-serif;
            line-height: 1.8;
        }
        .wrap { max-width: 980px; margin: auto; padding: 22px 14px 50px; }
        .hero {
            background: linear-gradient(135deg, #46f320, #03804c);
            color: white;
            border-radius: var(--border-radius);
            padding: 28px 26px;
            margin-bottom: 18px;
            box-shadow: 0 8px 24px rgba(23, 50, 77, 0.17);
        }
        .hero h1 { margin: 0 0 8px; font-size: 26px; }
        .hero p { margin: 4px 0; color: #edf6fc; }
        .toolbar {
            display: flex; gap: 15px; flex-wrap: wrap; align-items: center;
            background: white; border-radius: var(--border-radius);
            padding: 15px 20px; box-shadow: 0 2px 9px rgba(23, 50, 77, 0.07);
            position: sticky; top: 10px; z-index: 100;
        }
        .progress-bar-container {
            flex: 1; min-width: 180px; background: #e5ebf0;
            height: 14px; border-radius: 20px; overflow: hidden;
        }
        .progress-bar-fill {
            display: block; height: 100%; background: var(--gold);
            width: 0%; transition: width 0.3s ease;
        }
        .count-text { font-weight: bold; color: var(--navy); }
        .section-badge {
            display: inline-block; background: var(--light); color: var(--blue);
            font-size: 13px; font-weight: bold; padding: 4px 10px;
            border-radius: 6px; margin-bottom: 10px; border: 1px solid #c8dce9;
        }
        .question-card {
            background: white; border-radius: var(--border-radius); padding: 24px;
            margin: 15px 0; box-shadow: 0 3px 12px rgba(23, 50, 77, 0.05);
            border: 2px solid transparent; transition: border-color 0.2s;
        }
        .question-card.answered { border-color: #c8dce9; }
        .q-head { display: flex; gap: 12px; align-items: flex-start; font-weight: bold; font-size: 17px; }
        .q-num {
            background: var(--navy); color: #fff; border-radius: 50%;
            min-width: 32px; height: 32px; line-height: 32px;
            text-align: center; font-size: 14px; flex-shrink: 0;
        }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0 0 44px; }
        @media(max-width: 768px) { .options-grid { grid-template-columns: 1fr; margin-left: 0; margin-right: 0;} }
        .option-label {
            border: 1px solid #ccd7e0; border-radius: 8px; padding: 10px 15px;
            cursor: pointer; background: #fff; transition: all 0.2s;
            display: flex; align-items: center;
        }
        .option-label:hover { background: #f1f7fc; border-color: var(--blue); }
        .option-label input { accent-color: var(--blue); margin-left: 10px; flex-shrink: 0;}
        .btn {
            border: 0; border-radius: 8px; padding: 12px 24px;
            font-size: 15px; font-weight: bold; cursor: pointer;
            transition: filter 0.2s; color: white;
        }
        .btn:hover { filter: brightness(0.9); }
        .btn-primary { background: var(--gold); color: var(--navy); }
        .btn-secondary { background: var(--navy); }
        .select-btn {
            background: white; color: var(--navy); 
            border: 2px solid var(--navy); outline: none;
            font-family: inherit; font-size: 14px; padding: 10px 15px;
        }
        .actions { display: flex; gap: 12px; margin-top: 25px; flex-wrap: wrap; align-items: center;}
        .result-container {
            display: none; background: white; border-radius: var(--border-radius);
            padding: 25px; margin-top: 30px; box-shadow: 0 4px 15px rgba(23, 50, 77, 0.1);
        }
        .result-container.show { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .score-text { font-size: 28px; color: var(--navy); font-weight: bold; margin-bottom: 5px;}
        .review-box { border-top: 1px solid #e1e8ed; padding: 15px 0; margin-top: 15px; }
        .review-box.wrong { border-right: 5px solid var(--red); padding-right: 15px; }
        .review-box.correct { border-right: 5px solid var(--green); padding-right: 15px; }
        .text-wrong { color: var(--red); font-weight: bold; }
        .text-correct { color: var(--green); font-weight: bold; }
    </style>
</head>
<body>
<div class="wrap">
    <header class="hero">
        <h1>محاكي الامتحان النهائي (Mock Exam) 🎯</h1>
        <p><b>بنك الأسئلة الشامل: 338 سؤال (من المحاضرة 1 إلى 11) | المادة: أمن المعلومات</b></p>
        <p>قم باختيار المحاضرة وعدد الأسئلة التي تريد اختبار نفسك بها في كل جولة.</p>
    </header>
    <div class="toolbar">
        <span class="count-text" id="answeredCount">تمت الإجابة: 0 / 0</span>
        <div class="progress-bar-container"><span class="progress-bar-fill" id="progressBar"></span></div>
        <span id="percentText" class="count-text">0%</span>
    </div>
    <form id="quizForm"></form>
    <div class="actions">
        <button type="button" id="submitBtn" class="btn btn-primary">إنهاء الاختبار وعرض النتيجة</button>
        <button type="button" id="refreshBtn" class="btn btn-secondary">تحديث (سحب أسئلة جديدة)</button>
        
        <!-- قائمة اختيار المحاضرة -->
        <select id="lectureSelect" class="btn select-btn">
            <option value="all" selected>جميع المحاضرات</option>
            <!-- سيتم إضافة المحاضرات هنا برمجياً -->
        </select>

        <!-- قائمة اختيار عدد الأسئلة -->
        <select id="qCountSelect" class="btn select-btn">
            <option value="10">10 أسئلة</option>
            <option value="20">20 سؤال</option>
            <option value="30">30 سؤال</option>
            <option value="50" selected>50 سؤال (الافتراضي)</option>
            <option value="100">100 سؤال</option>
            <option value="all">جميع الأسئلة المتاحة</option>
        </select>
    </div>
    <section id="resultSection" class="result-container" aria-live="polite"></section>
</div>

<!-- استدعاء ملف الأسئلة الخارجي -->
<script src="All_Questions.js"></script>

<script>
    var currentQuizQuestions = [];
    var isSubmitted = false;

    var quizForm = document.getElementById('quizForm');
    var resultSection = document.getElementById('resultSection');
    var answeredCountEl = document.getElementById('answeredCount');
    var progressBar = document.getElementById('progressBar');
    var percentText = document.getElementById('percentText');
    var qCountSelect = document.getElementById('qCountSelect');
    var lectureSelect = document.getElementById('lectureSelect');
    var submitBtn = document.getElementById('submitBtn');

    var prevCount = qCountSelect.value;
    var prevLecture = lectureSelect.value;

    // تهيئة قائمة المحاضرات من ملف الأسئلة
    function populateLectures() {
        if(typeof generatedQuestions === 'undefined' || generatedQuestions.length === 0) return;
        
        var uniqueLectures = [];
        for (var i = 0; i < generatedQuestions.length; i++) {
            var sec = generatedQuestions[i].section;
            if (uniqueLectures.indexOf(sec) === -1) {
                uniqueLectures.push(sec);
            }
        }
        
        // ترتيب المحاضرات رقمياً
        uniqueLectures.sort(function(a, b) {
            var numA = parseInt(a.replace(/[^0-9]/g, '')) || 0;
            var numB = parseInt(b.replace(/[^0-9]/g, '')) || 0;
            return numA - numB;
        });

        for (var j = 0; j < uniqueLectures.length; j++) {
            var opt = document.createElement('option');
            opt.value = uniqueLectures[j];
            opt.textContent = uniqueLectures[j];
            lectureSelect.appendChild(opt);
        }
    }

    function shuffleArray(array) {
        var currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            var temp = array[currentIndex];
            array[currentIndex] = array[randomIndex];
            array[randomIndex] = temp;
        }
        return array;
    }

    function getSelectedCount(maxAvail) {
        var val = qCountSelect.value;
        return val === 'all' ? maxAvail : parseInt(val);
    }

    function initQuiz() {
        if(typeof generatedQuestions === 'undefined' || generatedQuestions.length === 0) {
            quizForm.innerHTML = '<h3 style="text-align:center; color:var(--red);">عذراً، لم يتم العثور على الأسئلة. تأكد من وجود ملف All_Questions.js في نفس المجلد!</h3>';
            return;
        }
        
        var filteredQuestions = generatedQuestions;
        if (lectureSelect.value !== 'all') {
            filteredQuestions = generatedQuestions.filter(function(q) {
                return q.section === lectureSelect.value;
            });
        }

        var numQuestions = getSelectedCount(filteredQuestions.length);
        
        var shuffledBank = shuffleArray(filteredQuestions.slice());
        currentQuizQuestions = shuffledBank.slice(0, Math.min(numQuestions, shuffledBank.length));
        
        if (currentQuizQuestions.length === 0) {
            quizForm.innerHTML = '<h3 style="text-align:center;">لا توجد أسئلة لهذه المحاضرة.</h3>';
        } else {
            renderQuestions();
        }
        updateProgress();
    }

    function renderQuestions() {
        quizForm.innerHTML = ''; 
        for(var i=0; i<currentQuizQuestions.length; i++) {
            var item = currentQuizQuestions[i];
            var optionsHTML = '';
            for(var j=0; j<item.o.length; j++) {
                var opt = item.o[j];
                optionsHTML += '<label class="option-label"><input type="radio" name="q' + i + '" value="' + j + '"><span>' + String.fromCharCode(65 + j) + '. ' + opt + '</span></label>';
            }
            var questionHTML = '<article class="question-card" id="questionCard-' + i + '"><span class="section-badge">' + item.section + '</span><div class="q-head"><span class="q-num">' + (i + 1) + '</span><span>' + item.q + '</span></div><div class="options-grid">' + optionsHTML + '</div></article>';
            quizForm.insertAdjacentHTML('beforeend', questionHTML);
        }
        quizForm.addEventListener('change', function(e) {
            if (e.target.tagName.toLowerCase() === 'input' && e.target.type === 'radio') {
                e.target.parentNode.parentNode.parentNode.className = 'question-card answered';
                updateProgress();
            }
        });
    }

    function getUserAnswers() {
        var answers = [];
        for(var i=0; i<currentQuizQuestions.length; i++) {
            var radios = document.getElementsByName('q' + i);
            var selected = null;
            for(var j=0; j<radios.length; j++) {
                if(radios[j].checked) {
                    selected = parseInt(radios[j].value);
                    break;
                }
            }
            answers.push(selected);
        }
        return answers;
    }

    function updateProgress() {
        var answers = getUserAnswers();
        var answeredCount = 0;
        for(var i=0; i<answers.length; i++) {
            if(answers[i] !== null) answeredCount++;
        }
        var total = currentQuizQuestions.length;
        var percentage = total === 0 ? 0 : Math.round((answeredCount / total) * 100);

        answeredCountEl.innerHTML = 'تمت الإجابة: ' + answeredCount + ' / ' + total;
        progressBar.style.width = percentage + '%';
        percentText.innerHTML = percentage + '%';
    }

    function submitQuiz() {
        if (isSubmitted || currentQuizQuestions.length === 0) return;
        var answers = getUserAnswers();
        var unansweredCount = 0;
        for(var i=0; i<answers.length; i++) {
            if(answers[i] === null) unansweredCount++;
        }
        if (unansweredCount > 0) {
            if (!confirm('يوجد ' + unansweredCount + ' أسئلة لم تقم بالإجابة عليها. هل أنت متأكد من الإنهاء؟')) return;
        }

        var score = 0;
        var reviewHTML = '';

        for(var k=0; k<answers.length; k++) {
            var userAns = answers[k];
            var questionData = currentQuizQuestions[k];
            var isCorrect = (userAns === questionData.a);
            
            if (isCorrect) {
                score++;
            } else {
                var userAnswerText = (userAns === null) ? 'لم تتم الإجابة' : String.fromCharCode(65 + userAns) + '. ' + questionData.o[userAns];
                var correctAnswerText = String.fromCharCode(65 + questionData.a) + '. ' + questionData.o[questionData.a];
                reviewHTML += '<div class="review-box wrong"><span class="section-badge">' + questionData.section + '</span><h4>' + (k + 1) + '. ' + questionData.q + '</h4><div class="text-wrong">إجابتك: ' + userAnswerText + '</div><div class="text-correct">الإجابة الصحيحة: ' + correctAnswerText + '</div><div style="margin-top:5px; font-size: 14px; color: var(--muted)"><b>التوضيح:</b> ' + questionData.e + '</div></div>';
            }
        }

        var total = currentQuizQuestions.length;
        var scorePercentage = total === 0 ? 0 : Math.round((score / total) * 100);
        var feedbackTitle = scorePercentage >= 90 ? 'مستوى ممتاز جداً! جاهز للامتحان 🥇' : 
                            scorePercentage >= 75 ? 'مستوى جيد جداً، استمر 🥈' : 
                            scorePercentage >= 60 ? 'تحتاج لبعض المراجعة الإضافية 🥉' : 
                            'راجع المحاضرات بتركيز أكبر، يمكنك التحسن!';

        var finalHTML = '<div class="score-text">النتيجة: ' + score + ' من ' + total + ' (' + scorePercentage + '%)</div><p style="font-size: 18px;">' + feedbackTitle + '</p><hr style="border:0; border-top:1px solid #eee; margin:15px 0;">';

        if (score === total && total > 0) {
            finalHTML += '<div class="review-box correct"><b>أحسنت يا وحش! إجاباتك كلها صحيحة 100% 🚀</b></div>';
        } else if (total > 0) {
            finalHTML += '<h3>مراجعة الأخطاء:</h3> ' + reviewHTML;
        }

        resultSection.innerHTML = finalHTML;
        resultSection.className = 'result-container show';
        resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        isSubmitted = true;
        
        var allInputs = document.getElementsByTagName('input');
        for(var m=0; m<allInputs.length; m++) {
            if(allInputs[m].type === 'radio') allInputs[m].disabled = true;
        }
        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.5';
    }

    function resetQuizUI() {
        isSubmitted = false;
        resultSection.className = 'result-container';
        resultSection.innerHTML = '';
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        initQuiz();
    }

    submitBtn.onclick = submitQuiz;
    
    document.getElementById('refreshBtn').onclick = function() {
        if (isSubmitted || confirm('هل أنت متأكد من رغبتك ببدء اختبار جديد؟')) {
            resetQuizUI();
        }
    };

    lectureSelect.onchange = function() {
        if (isSubmitted || confirm('تغيير المحاضرة سيبدأ اختباراً جديداً، هل أنت متأكد؟')) {
            prevLecture = this.value;
            resetQuizUI();
        } else {
            this.value = prevLecture;
        }
    };

    qCountSelect.onchange = function() {
        if (isSubmitted || confirm('تغيير عدد الأسئلة سيبدأ اختباراً جديداً، هل أنت متأكد؟')) {
            prevCount = this.value;
            resetQuizUI();
        } else {
            this.value = prevCount;
        }
    };

    populateLectures();
    initQuiz();
</script>
</body>
</html>
